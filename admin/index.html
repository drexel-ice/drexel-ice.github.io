<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ICE Lab content admin</title>
    <link rel="icon" href="/assets/img/icelab_logo.png" />
  </head>
  <body>
    <!-- Sveltia CMS: a Decap-compatible git-based CMS. Reads ./config.yml,
         signs in with GitHub (personal access token, or an OAuth authenticator
         if one is configured later) and commits edits to the repo, which the
         Deploy site workflow then publishes. Self-hosted bundle (v0.171.0,
         from @sveltia/cms on npm) so no third-party CDN is trusted at runtime;
         update it by re-downloading the dist file in a PR. -->
    <script src="./sveltia-cms.js" type="module"></script>
    <script type="module">
      // Teach the CMS to round-trip BibTeX so _bibliography/papers.bib is
      // editable as a single raw-text document.
      window.CMS?.registerCustomFormat?.("bibtex", "bib", {
        fromFile: (text) => ({ raw: text }),
        toFile: ({ raw }) => raw ?? "",
      });

      // No OAuth authenticator is deployed for this site, so Sveltia's
      // "Sign In with GitHub" button would silently fall back to Netlify's
      // OAuth service and hang. Hide it and point people at token sign-in
      // until an authenticator (e.g. sveltia-cms-auth) is set up.
      const steerToTokenSignIn = () => {
        for (const btn of document.querySelectorAll("button")) {
          const label = btn.textContent.trim();
          if (/^Sign In with\b/i.test(label) && btn.style.display !== "none") {
            btn.style.display = "none";
            if (!document.getElementById("token-signin-note")) {
              const note = document.createElement("p");
              note.id = "token-signin-note";
              note.textContent =
                "Use “Sign In Using Access Token” with a GitHub token " +
                "that has Contents read/write on this repository.";
              note.style.cssText =
                "max-width: 22rem; margin: 0 auto 1rem; font-size: 0.85rem; opacity: 0.8;";
              btn.parentNode?.insertBefore(note, btn);
            }
          }
        }
      };
      new MutationObserver(steerToTokenSignIn).observe(document.body, {
        childList: true,
        subtree: true,
      });
    </script>
  </body>
</html>
