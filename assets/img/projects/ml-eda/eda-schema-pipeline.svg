<text x="492" y="264" font-size="11" font-weight="400" fill="#1f2d3a">Binary spatial maps — combinational and sequential</text>
<text x="492" y="279" font-size="11" font-weight="400" fill="#1f2d3a">cell placement, pin locations, per-layer routing</text>
<rect x="420" y="298" width="382" height="70" rx="8" fill="#ffffff" stroke="#f0dca8"/>
<rect x="434" y="310" width="46" height="46" rx="6" fill="#fff7e4" stroke="#f0dca8"/>
