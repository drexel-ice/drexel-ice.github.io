<text x="492" y="186" font-size="11" font-weight="400" fill="#1f2d3a">Netlist graph, timing-path subgraphs, and an</text>
<text x="492" y="201" font-size="11" font-weight="400" fill="#1f2d3a">interconnect graph with wire segments as nodes</text>
