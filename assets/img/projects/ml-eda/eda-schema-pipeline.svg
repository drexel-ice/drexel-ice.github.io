<text x="433" y="85" font-size="10" font-weight="700" letter-spacing="0.9" fill="#a97b09">STAGE-AWARE PROPERTY GRAPH</text>
<text x="433" y="102" font-size="11" font-weight="400" fill="#1f2d3a">Flow · stage · constraints   |   netlist, clock tree, timing path, PDN</text>
<text x="433" y="118" font-size="11" font-weight="400" fill="#1f2d3a">gates, nets, pins, arcs   |   cell, area, power, timing, routability QoR</text>
