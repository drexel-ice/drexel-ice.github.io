<rect x="466" y="319" width="7" height="28" rx="1.5" fill="url(#hm)" fill-opacity="1.00"/>
<text x="492" y="325" font-size="10" font-weight="700" letter-spacing="0.9" fill="#a97b09">HEATMAP</text>
<text x="492" y="342" font-size="11" font-weight="400" fill="#1f2d3a">RUDY routability (net, pin, long- and short-range),</text>
<text x="492" y="357" font-size="11" font-weight="400" fill="#1f2d3a">IR-drop and electromigration maps</text>
<rect x="420" y="374" width="382" height="52" rx="7" fill="#ffffff" stroke="#a97b09" stroke-dasharray="4 3"/>
<text x="433" y="393" font-size="11.5" font-weight="500" fill="#a97b09">Every attribute records the stage at which it becomes available,</text>
<text x="433" y="408" font-size="11.5" font-weight="500" fill="#a97b09">so the information boundary is part of the task definition</text>
<rect x="420" y="436" width="382" height="30" rx="7" fill="#a97b09" fill-opacity="0.1"/>
<text x="611" y="455" font-size="12" font-weight="700" fill="#a97b09" text-anchor="middle">275 M+ gates  ·  75 M+ nets  ·  36 M+ timing paths</text>
<rect x="848" y="66" width="322" height="148" rx="8" fill="#ffffff" stroke="#bbe1cb"/>
<text x="861" y="85" font-size="10" font-weight="700" letter-spacing="0.9" fill="#1b8a51">TWELVE PREDICTION TASKS</text>
<text x="861" y="110" font-size="11" font-weight="700" fill="#1b8a51">Whole circuit</text>
<text x="961" y="110" font-size="11" fill="#1f2d3a">area, power, total wirelength</text>
<text x="861" y="128" font-size="11" font-weight="700" fill="#1b8a51">Whole circuit</text>
<text x="961" y="128" font-size="11" fill="#1f2d3a">worst arrival, worst slack, TNS</text>
<text x="861" y="146" font-size="11" font-weight="700" fill="#1b8a51">Per interconnect</text>
<text x="961" y="146" font-size="11" fill="#1f2d3a">length</text>
<text x="861" y="164" font-size="11" font-weight="700" fill="#1b8a51">Per timing path</text>
<text x="961" y="164" font-size="11" fill="#1f2d3a">arrival time, slack</text>
<text x="861" y="182" font-size="11" font-weight="700" fill="#1b8a51">Per net arc</text>
<text x="961" y="182" font-size="11" fill="#1f2d3a">delay</text>
<text x="861" y="200" font-size="11" font-weight="700" fill="#1b8a51">Per cell arc</text>
<text x="961" y="200" font-size="11" fill="#1f2d3a">delay, slew</text>
<rect x="848" y="226" width="322" height="83" rx="8" fill="#ffffff" stroke="#bbe1cb"/>
<text x="861" y="245" font-size="10" font-weight="700" letter-spacing="0.9" fill="#1b8a51">EACH TASK FIXES</text>
<text x="861" y="262" font-size="11.5" font-weight="400" fill="#1f2d3a">Source stage → target stage</text>
<text x="861" y="279" font-size="11.5" font-weight="400" fill="#1f2d3a">The EDA tool's own estimate as reference</text>
<text x="861" y="296" font-size="11.5" font-weight="400" fill="#1f2d3a">MAE, MAPE, R² and upper-tail metrics</text>
<rect x="848" y="321" width="322" height="83" rx="8" fill="#ffffff" stroke="#bbe1cb"/>
<text x="861" y="340" font-size="10" font-weight="700" letter-spacing="0.9" fill="#1b8a51">EVALUATION</text>
<text x="861" y="357" font-size="11.5" font-weight="400" fill="#1f2d3a">Leave-one-circuit-out — 18 folds</text>
<text x="861" y="374" font-size="11.5" font-weight="400" fill="#1f2d3a">One circuit withheld entirely per fold</text>
<text x="861" y="391" font-size="11.5" font-weight="400" fill="#1f2d3a">Generalization, not interpolation</text>
<rect x="848" y="436" width="322" height="30" rx="7" fill="#1b8a51" fill-opacity="0.1"/>
